<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Hub - Your Academic Success Partner</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Landing Page / Welcome Screen -->
    <div id="welcomeScreen" class="screen active">
        <div class="welcome-container">
            <div class="greeting-section">
                <h1 id="timeGreeting" class="time-greeting">Good Morning</h1>
                <p class="welcome-subtitle">Ready to achieve greatness?</p>
            </div>

            <div class="affirmation-section">
                <div class="affirmation-card">
                    <svg class="quote-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M6 17h3l2-4V7H5v6h3zm8 0h3l2-4V7h-6v6h3z"/>
                    </svg>
                    <p id="affirmationText" class="affirmation-text">Loading...</p>
                </div>
                <button id="refreshQuote" class="refresh-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
                    </svg>
                    New Quote
                </button>
            </div>

            <button id="enterHubBtn" class="enter-hub-btn">Enter Study Hub →</button>
        </div>
    </div>

    <!-- Main Study Hub -->
    <div id="studyHub" class="screen">
        <nav class="navbar">
            <div class="nav-brand">
                <h2>📚 Study Hub</h2>
            </div>
            <div class="nav-actions">
                <button id="newDocBtn" class="icon-btn" title="New Google Doc">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/>
                    </svg>
                </button>
                <button id="aiBtn" class="icon-btn" title="AI Assistant">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/>
                    </svg>
                </button>
                <button id="backToWelcomeBtn" class="icon-btn" title="Back to Welcome">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
                    </svg>
                </button>
            </div>
        </nav>

        <div class="hub-container">
            <div class="hub-header">
                <h1 id="hubGreeting">Good Morning</h1>
                <p class="hub-date" id="currentDate">Loading...</p>
            </div>

            <!-- Quick Actions -->
            <div class="quick-actions">
                <button class="quick-action-card" onclick="openGoogleDoc()">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/>
                    </svg>
                    <span>New Doc</span>
                </button>
                <button class="quick-action-card" onclick="openGoogleSheets()">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4z"/>
                    </svg>
                    <span>New Sheet</span>
                </button>
                <button class="quick-action-card" onclick="openGoogleSlides()">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M21 3H3c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H3V5h18v14z"/>
                    </svg>
                    <span>New Slides</span>
                </button>
            </div>

            <!-- Subject Planner -->
            <div class="planner-section">
                <h2 class="section-title">My Subjects</h2>
                <div class="subjects-grid" id="subjectsGrid">
                    <!-- Subjects will be generated by JS -->
                </div>
                <button class="add-subject-btn" id="addSubjectBtn">+ Add Subject</button>
            </div>

            <!-- Tasks Overview -->
            <div class="tasks-section">
                <h2 class="section-title">Today's Tasks</h2>
                <div id="todayTasks" class="tasks-list">
                    <!-- Tasks will be populated here -->
                </div>
            </div>
        </div>
    </div>

    <!-- AI Assistant Modal -->
    <div id="aiModal" class="modal">
        <div class="modal-content ai-chat">
            <div class="modal-header">
                <h3>🤖 AI Study Assistant</h3>
                <button class="close-btn" id="closeAiBtn">&times;</button>
            </div>
            <div class="chat-messages" id="chatMessages">
                <div class="ai-message">
                    <p>Hi! I'm your AI study assistant. Ask me anything about your subjects, homework, or studying tips!</p>
                </div>
            </div>
            <div class="chat-input-container">
                <input type="text" id="chatInput" placeholder="Ask me anything..." />
                <button id="sendChatBtn">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <!-- Add Subject Modal -->
    <div id="addSubjectModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Add New Subject</h3>
                <button class="close-btn" id="closeSubjectModalBtn">&times;</button>
            </div>
            <div class="modal-body">
                <input type="text" id="subjectNameInput" placeholder="Subject name (e.g., Math, English)" />
                <select id="subjectColorPicker">
                    <option value="#6366f1">Indigo</option>
                    <option value="#8b5cf6">Purple</option>
                    <option value="#ec4899">Pink</option>
                    <option value="#f59e0b">Amber</option>
                    <option value="#10b981">Green</option>
                    <option value="#3b82f6">Blue</option>
                    <option value="#ef4444">Red</option>
                    <option value="#14b8a6">Teal</option>
                </select>
                <button id="saveSubjectBtn" class="primary-btn">Add Subject</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
